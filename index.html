<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kabby+ Reach</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0}

/* Layout: control-room shell — slim nav rail on the left, dense working canvas on the right; player view takes the whole frame. */
:root{
  --bg:#f3f4f8; --panel:#ffffff; --panel-2:#eceef5; --line:#dcdfea; --fg:#141726; --muted:#5d6279;
  --accent:#0a8fb3; --accent-ink:#ffffff; --neon:#c2187a; --good:#16875a; --warn:#b26a00; --bad:#c23a3a;
  --shadow:0 1px 2px rgba(20,23,38,.06),0 6px 20px rgba(20,23,38,.05);
  --f-display:"Outfit",ui-sans-serif,system-ui,sans-serif;
  --f-body:"DM Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0d17; --panel:#131628; --panel-2:#1a1e34; --line:#262b46; --fg:#e8eaf6; --muted:#8e94b4;
  --accent:#2fd0f5; --accent-ink:#06121a; --neon:#ff4fb0; --good:#3ad69a; --warn:#f5b74a; --bad:#ff6b6b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d17; --panel:#131628; --panel-2:#1a1e34; --line:#262b46; --fg:#e8eaf6; --muted:#8e94b4;
  --accent:#2fd0f5; --accent-ink:#06121a; --neon:#ff4fb0; --good:#3ad69a; --warn:#f5b74a; --bad:#ff6b6b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:8px;padding:0 8px}
.brand-logo{height:40px;width:auto;display:block}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.brand b i{font-style:normal;color:var(--neon)}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--panel-2);color:var(--fg)}
.nav a.on{background:var(--panel-2);color:var(--fg)}
.nav a.on svg{color:var(--accent)}
.nav svg{width:18px;height:18px;flex:none}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.sync{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 20%,transparent)}
.dot.bad{background:var(--bad)}

main{padding-block:28px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:22px;max-width:1280px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{font-size:28px;font-weight:600}
.head p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--panel-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:6px;border-radius:6px;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--panel-2);color:var(--fg)}
.icon-btn svg{width:16px;height:16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .val{font-family:var(--f-display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.hl .val{color:var(--accent)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:17px;font-weight:600}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel .ph p{margin:0;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.pill.on{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.off{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.pill.vid{color:var(--neon);background:color-mix(in srgb,var(--neon) 12%,transparent)}
.pill.img{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pill .dot{width:6px;height:6px}
.pill.on .dot{background:var(--good)} .pill.off .dot{background:var(--bad)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:13px}

.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);cursor:pointer;background:var(--panel)}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--panel));color:var(--fg)}
.drop strong{color:var(--fg);font-weight:600}
.drop svg{width:28px;height:28px;color:var(--accent)}
.uploads{display:flex;flex-direction:column;gap:6px}
.up{display:flex;align-items:center;gap:10px;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.up .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:16/9;background:#05060c;position:relative;max-width:100%;overflow:hidden}
.thumb img,.thumb video{width:100%;height:100%;object-fit:contain;display:block}
.thumb .pill{position:absolute;top:8px;left:8px;background:rgba(5,6,12,.75);color:#fff}
.thumb .dur{position:absolute;bottom:8px;right:8px;font-family:var(--f-mono);font-size:11px;background:rgba(5,6,12,.75);color:#fff;padding:1px 6px;border-radius:4px}
.mcard .meta{padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mcard .meta b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .meta span{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.mcard .act{display:flex;justify-content:flex-end;padding:0 6px 6px;margin-top:auto}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:17px;font-weight:600}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card .sub{color:var(--muted);font-size:13px}
.specs{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}
.specs dt{color:var(--muted)}
.specs dd{margin:0;font-family:var(--f-mono);font-size:12.5px;min-width:0;overflow-wrap:anywhere}
.strip{display:flex;gap:3px;height:34px;border-radius:6px;overflow:hidden;background:var(--panel-2)}
.strip div{flex:1;background-size:cover;background-position:center;min-width:6px}
.card .foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.assign-list{display:flex;flex-direction:column;gap:4px;font-size:13px}
.assign-list div{display:flex;justify-content:space-between;gap:8px}
.assign-list .when{color:var(--muted);font-family:var(--f-mono);font-size:11.5px}

.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,6,12,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal.wide{width:min(1040px,100%)}
.modal header{padding:18px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal header h2{font-size:20px}
.modal header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.modal .body{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap}
.modal footer .grow{margin-right:auto;color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.inp{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.mapwrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.mapwrap{grid-template-columns:1fr}}
.mappanel{padding:10px}
.mapslot{height:600px;border-radius:12px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line)}
@media (max-width:900px){.mapslot{height:400px}}
.mapcanvas{width:100%;height:100%}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:12px;color:var(--muted);padding:10px 6px 2px}
.maplegend>span{display:inline-flex;align-items:center;gap:6px}
/* voitures */
.car{position:relative;width:48px;height:48px;display:grid;place-items:center;cursor:pointer}
.car-rot{display:block;line-height:0;transition:transform .8s ease;filter:drop-shadow(0 2px 4px rgba(25,41,151,.45)) drop-shadow(0 0 1px rgba(0,0,0,.4))}
.car-body{stroke:#fff;stroke-width:2.2}
.car-sign{fill:#ffd400;stroke:rgba(0,0,0,.25);stroke-width:.6}
.car-badge{position:absolute;top:5px;right:5px;width:12px;height:12px;border-radius:50%;border:2px solid #fff;background:var(--good);box-shadow:0 1px 3px rgba(0,0,0,.35);z-index:2}
.car.st-stale .car-badge{background:var(--warn)}
.car.st-off .car-badge{background:var(--bad)}
.car.st-off .car-rot{filter:grayscale(.75) drop-shadow(0 1px 2px rgba(0,0,0,.35));opacity:.7}
.car-ring{position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle,rgba(255,45,155,.55),rgba(59,73,255,.25) 60%,transparent 70%);opacity:0}
.car.moving .car-ring{animation:carpulse 1.6s ease-out infinite}
@keyframes carpulse{0%{transform:scale(.45);opacity:.95}100%{transform:scale(1.75);opacity:0}}
@media (prefers-reduced-motion:reduce){.car.moving .car-ring{animation:none}.car-rot{transition:none}}
.car-label{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(90deg,#3b49ff,#ff2d9b);color:#fff;font:600 12px/1.2 var(--f-body);padding:4px 9px;border-radius:999px;box-shadow:0 4px 12px rgba(59,73,255,.35);opacity:0;pointer-events:none;transition:opacity .15s}
.car:hover .car-label,.car.sel .car-label{opacity:1}
.car.sel .car-rot{filter:drop-shadow(0 0 7px #ff2d9b) drop-shadow(0 0 2px #fff)}
.car-mini{position:relative;display:inline-block;line-height:0;margin-right:8px;vertical-align:middle}
.car-mini svg{width:13px;height:20px}
.car-mini.st-off svg,.car-mini.st-none svg{filter:grayscale(.8);opacity:.7}
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--panel);margin-left:-11px;margin-right:6px;vertical-align:-6px;position:relative}
.sdot.st-on{background:var(--good)}.sdot.st-stale{background:var(--warn)}.sdot.st-off{background:var(--bad)}.sdot.st-none{background:var(--muted)}
tr.sel td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
/* habillage MapLibre aux couleurs du CMS */
.maplibregl-map{font:inherit}
.maplibregl-ctrl-group{background:var(--panel)!important;border:1px solid var(--line);border-radius:10px!important;box-shadow:var(--shadow)!important;overflow:hidden}
.maplibregl-ctrl-group button{width:34px;height:34px}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:none}
:root[data-theme="dark"] .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(1)}}
.maplibregl-ctrl-attrib{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--muted);font-size:11px}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-attrib a{color:var(--muted)!important}
:root[data-theme="dark"] .maplibregl-ctrl-attrib-button{filter:invert(1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .maplibregl-ctrl-attrib-button{filter:invert(1)}}
.kpop .maplibregl-popup-content{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px}
.kpop .maplibregl-popup-close-button{color:var(--muted);font-size:18px;padding:2px 8px}
.kpop.maplibregl-popup-anchor-bottom .maplibregl-popup-tip{border-top-color:var(--panel)}
.kpop.maplibregl-popup-anchor-top .maplibregl-popup-tip{border-bottom-color:var(--panel)}
.kpop.maplibregl-popup-anchor-left .maplibregl-popup-tip{border-right-color:var(--panel)}
.kpop.maplibregl-popup-anchor-right .maplibregl-popup-tip{border-left-color:var(--panel)}
.mpop-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 18px 2px 0}
.mpop-h b{font-family:var(--f-display);font-size:15px}
.mpop .specs{margin-top:8px}
.prog{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.dpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;max-height:260px;overflow:auto;padding:2px}
.dpick label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--panel)}
.dpick label.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.field .dpick label{flex-direction:row;font-weight:400;font-size:13px;color:var(--fg);text-transform:none;letter-spacing:0;margin:0}
.field .dpick input[type=checkbox]{width:18px;height:18px;min-height:0;flex:none;margin:1px 0 0;padding:0;accent-color:var(--accent)}
.dpick span{display:flex;flex-direction:column;min-width:0}
.dpick b{font-size:14px;overflow-wrap:anywhere}
.dpick .hint{font-size:12px}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
tr.click{cursor:pointer} tr.click:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.hint{font-size:12px;color:var(--muted);margin:0}

.editor{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:16px;min-height:0}
.lib,.seq{border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;max-height:52vh}
.lib h3,.seq h3{font-size:13px;font-family:var(--f-body);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.lib-list,.seq-list{overflow:auto;padding:6px;display:flex;flex-direction:column;gap:4px}
.li{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;border:1px solid transparent;background:var(--panel)}
.li:hover{background:var(--panel-2)}
.li .mini{width:64px;aspect-ratio:16/9;border-radius:4px;background:#05060c;flex:none;overflow:hidden}
.li .mini img,.li .mini video{width:100%;height:100%;object-fit:cover;display:block}
.li .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.li .nm b{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .nm span{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.li.drag{opacity:.4}
.li.dropto{border-color:var(--accent)}
.grip{cursor:grab;color:var(--muted);padding:0 2px;display:grid;place-items:center}
.grip svg{width:14px;height:14px}
.idx{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:18px;text-align:right}
.dur-in{width:72px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;text-align:right;font-family:var(--f-mono);font-size:12px}
.arow{display:grid;grid-template-columns:minmax(0,2fr) 80px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:var(--r);padding:12px 14px;font-size:13px}
.code{font-family:var(--f-mono);font-size:12px;background:var(--panel-2);padding:2px 6px;border-radius:4px;user-select:all;overflow-wrap:anywhere}


/* players & pairing */
.pid{font-family:var(--f-mono);font-weight:500;letter-spacing:.06em;font-size:13px;background:var(--panel-2);padding:2px 8px;border-radius:5px;white-space:nowrap}
.pid-in{font-family:var(--f-mono);font-size:22px!important;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.pbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.pbox.none{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-style:dashed}
.pbox-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pbox-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pair{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 30%,#1b1f3a,#05060c 70%)}
.pair-in{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:720px}
.pair-logo{font-family:var(--f-display);font-size:clamp(28px,4vw,44px);font-weight:700;letter-spacing:-.02em}
.pair-logo i{font-style:normal;color:#ff4fb0}
.pair-logo span{font-family:var(--f-mono);font-size:.32em;font-weight:400;color:#8e94b4;letter-spacing:.12em;text-transform:uppercase;vertical-align:middle}
.pair-lbl{margin:18px 0 0;color:#8e94b4;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.2em;font-size:13px}
.pair-id{white-space:nowrap;font-family:var(--f-mono);font-size:clamp(40px,9vw,120px);font-weight:500;letter-spacing:.08em;color:#2fd0f5;line-height:1;text-shadow:0 0 32px rgba(47,208,245,.35)}
.pair-steps{margin:10px 0 0;padding-left:22px;text-align:left;color:#c8cbe0;font-size:clamp(14px,1.8vw,18px);display:flex;flex-direction:column;gap:6px}
.pair-status{display:flex;align-items:center;gap:8px;color:#8e94b4;font-size:14px;margin:8px 0 0}
.ident{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,6,12,.82);border:10px solid #ff4fb0;text-align:center}
.ident p{margin:0;color:#8e94b4;font-family:var(--f-mono);letter-spacing:.2em;text-transform:uppercase}
.ident b{display:block;font-family:var(--f-mono);font-size:clamp(48px,10vw,120px);color:#fff;letter-spacing:.08em}
.ident span{font-family:var(--f-display);font-size:clamp(20px,3vw,32px);color:#ff4fb0}
@media (prefers-reduced-motion:no-preference){.ident{animation:blink 1s ease-in-out 3}}
@keyframes blink{50%{border-color:#2fd0f5}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
  .brand span,.rail-foot{display:none}
  .nav{flex-direction:row}
  .nav a{padding:7px 10px}
  .nav a span{display:none}
  main{padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2,.editor{grid-template-columns:minmax(0,1fr)}
  .fgrid{grid-template-columns:1fr}
  .arow{grid-template-columns:1fr 1fr}
  .lib,.seq{max-height:40vh}
}


.login{min-height:100%;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login form,.login .box{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.login .brand{padding:0;margin-bottom:6px}
.login .msg{color:var(--bad);font-size:13px;min-height:1em;margin:0}
.who{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="loginForm">
    <div class="brand"><img class="brand-logo" src="logo-kabby.png" alt="kabby+" width="174" height="82"><span>Reach</span></div>
    <div class="field"><label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lPass">Mot de passe</label><input id="lPass" type="password" autocomplete="current-password" required></div>
    <button class="btn pri" id="loginGo" type="submit" style="justify-content:center">Se connecter</button>
    <button class="btn ghost" id="signupGo" type="button" style="justify-content:center">Première fois ? Créer mon accès</button>
    <p class="msg" id="loginMsg" role="alert"></p>
  </form>
</div>
<div id="app" class="app" hidden>
  <aside class="rail">
    <div class="brand"><img class="brand-logo" src="logo-kabby.png" alt="kabby+" width="174" height="82"><span>Reach</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">Connexion…</span></div>
      <div class="who" id="who"></div>
      <button class="btn sm ghost" id="logout" style="align-self:flex-start;padding-left:0">Se déconnecter</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
"use strict";
const CFG = window.KABBY_CONFIG || {};
/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dayKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (n, d=new Date()) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const fmtInt = n => Math.round(Number(n)||0).toLocaleString("fr-FR");
const fmtBytes = b => { b=Number(b)||0; if (b<1024) return b+" o"; if (b<1048576) return (b/1024).toFixed(1)+" Ko"; if (b<1073741824) return (b/1048576).toFixed(2)+" Mo"; return (b/1073741824).toFixed(2)+" Go"; };
const fmtSec = s => { s=Math.round(Number(s)||0); if (s<60) return s+" s"; const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), r=s%60; return h ? `${h} h ${pad(m)}` : `${m} min ${pad(r)}`; };
const fmtClock = s => { s=Math.round(Number(s)||0); return `${Math.floor(s/60)}:${pad(s%60)}`; };
const ts = v => v ? new Date(v).getTime() : 0;
const fmtAgo = v => { const t=ts(v); if (!t) return "jamais"; const s=(Date.now()-t)/1000; if (s<60) return "à l'instant"; if (s<3600) return `il y a ${Math.floor(s/60)} min`; if (s<86400) return `il y a ${Math.floor(s/3600)} h`; return `il y a ${Math.floor(s/86400)} j`; };
const fmtDay = k => { const [y,m,d]=String(k).split("-"); return `${d}/${m}`; };
const fmtPid = id => id ? id.slice(0,4)+"-"+id.slice(4) : "";
const normPid = s => String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const ONLINE_MS = 3*60*1000;

const ICONS = {
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  media:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h11M4 12h11M4 18h7"/><path d="m16 15 5 3-5 3z" fill="currentColor"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  screen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
  camp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10v4a1 1 0 0 0 1 1h3l6 4V5L7 9H4a1 1 0 0 0-1 1z"/><path d="M17 9a4 4 0 0 1 0 6M19.5 6.5a8 8 0 0 1 0 11"/></svg>',
  report:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  upA:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 15 6-6 6 6"/></svg>',
  dnA:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>'
};
const VIEWS = [["dashboard","Dashboard","dash"],["media","Médias","media"],["playlists","Playlists","list"],["campaigns","Campagnes","camp"],["displays","Écrans","screen"],["map","Carte","map"],["reports","Reporting","report"]];

/* ---------- state ---------- */
const S = { media:[], playlists:[], displays:[], devices:[], campaigns:[], camp:{}, loaded:false, sb:null, user:null,
  mediaFilter:"all", uploads:[], range:7, repDisplay:"all", rep:{}, status:"loading" };
const mediaById = id => S.media.find(m => m.id === id);
const plById = id => S.playlists.find(p => p.id === id);
const dispById = id => S.displays.find(d => d.id === id);
const campById = id => S.campaigns.find(c => c.id === id);
const campState = c => { const t=dayKey(); if (c.status==="paused") return "paused"; if (c.start_date > t) return "soon"; if (c.end_date < t) return "done"; return "live"; };
const campPill = c => ({live:'<span class="pill on"><span class="dot"></span>En cours</span>', soon:'<span class="pill img">À venir</span>', done:'<span class="pill">Terminée</span>', paused:'<span class="pill warn">En pause</span>'})[campState(c)];
const pubUrl = path => `${CFG.supabaseUrl}/storage/v1/object/public/media/${path.split("/").map(encodeURIComponent).join("/")}`;
const thumbUrl = m => m ? pubUrl(m.path) : "";
const itemDuration = it => { const m = mediaById(it.mediaId); if (!m) return 0; return m.type === "video" ? (Number(m.duration) || Number(it.duration) || 0) : (Number(it.duration) || 10); };
const plDuration = p => (p.items||[]).reduce((a,it) => a + itemDuration(it), 0);
const devOf = d => S.devices.find(v => v.display_id === d.id) || null;
const devOnline = v => !!v && Date.now() - ts(v.last_seen) < ONLINE_MS;
const isOnline = d => devOnline(devOf(d));
const nowOf = d => { const v=devOf(d); if(!devOnline(v)) return ""; const mid=v.now_playing?.mediaId; return mid ? (mediaById(mid)?.name||"") : ""; };
const isActiveAssign = (a, today=dayKey()) => (!a.start || a.start <= today) && (!a.end || a.end >= today);

function toast(msg){ const r=$("#toastRoot"); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>r.innerHTML="",3200); }
function fail(e, what="L'enregistrement"){ console.error(e); const m=String(e?.message||e||""); toast(/row-level security|permission|forbidden|42501/i.test(m) ? "Action refusée : votre compte n'est pas dans l'équipe autorisée." : /Payload too large|exceeded the maximum/i.test(m) ? "Fichier trop lourd pour votre offre Supabase." : `${what} a échoué : ${m.slice(0,120)}`); }
async function q(promise){ const { data, error } = await promise; if (error) throw error; return data; }

/* ---------- data ---------- */
async function loadAll(){
  const sb=S.sb;
  try{
    const [media, playlists, displays, devices, campaigns] = await Promise.all([
      q(sb.from("media").select("*").order("created_at",{ascending:false})),
      q(sb.from("playlists").select("*").order("updated_at",{ascending:false})),
      q(sb.from("displays").select("*").order("name")),
      q(sb.from("devices").select("player_id,display_id,info,cache,now_playing,command,last_seen,paired_at,created_at,last_pos,pos_at").order("last_seen",{ascending:false, nullsFirst:false})),
      q(sb.from("campaigns").select("*").order("start_date",{ascending:false})).catch(e=>{ console.warn("campagnes indisponibles", e); return []; })
    ]);
    Object.assign(S,{media,playlists,displays,devices,campaigns,loaded:true,status:"ready"}); setSync(true,"Synchronisé");
  }catch(e){ console.error(e); S.status="error"; setSync(false,"Connexion perdue"); }
  render(); if(ED && $("#libList")) drawLib();
}
const repKey = (from,to,disp) => `${from}|${to}|${disp}`;
async function loadReport(from,to,disp="all",force=false){
  const k=repKey(from,to,disp);
  if (S.rep[k] && !force && Date.now()-S.rep[k].at<30000) return S.rep[k].data;
  if (S.rep[k]?.pending) return S.rep[k].data;
  S.rep[k]={...(S.rep[k]||{}), pending:true};
  try{
    const data=await q(S.sb.rpc("report_summary",{p_from:from,p_to:to,p_display:disp==="all"?null:disp}));
    S.rep[k]={data,at:Date.now()};
  }catch(e){ console.error(e); S.rep[k]={data:S.rep[k]?.data||null, at:Date.now()}; }
  render(); return S.rep[k].data;
}
async function loadCamp(key, fn, args){
  if (S.camp[key]?.pending || (S.camp[key] && Date.now()-S.camp[key].at<30000)) return;
  S.camp[key]={...(S.camp[key]||{}), pending:true};
  try{ const data=await q(S.sb.rpc(fn,args)); S.camp[key]={data,at:Date.now()}; }
  catch(e){ console.error(e); S.camp[key]={data:S.camp[key]?.data||null, at:Date.now()}; }
  render(); if (ED?.campDetail===key) drawCampDetail();
}
function campRep(from=null,to=null,disp="all"){ const k=`list|${from}|${to}|${disp}`; const r=S.camp[k]; if(!r || (!r.pending && Date.now()-r.at>30000)) loadCamp(k,"report_campaigns",{p_from:from,p_to:to,p_display:disp==="all"?null:disp}); return r?.data||null; }
function rep(from,to,disp="all"){ const r=S.rep[repKey(from,to,disp)]; if(!r || (!r.pending && Date.now()-r.at>30000)) loadReport(from,to,disp); return r?.data || null; }

/* ---------- routing ---------- */
function currentView(){ const h=location.hash.slice(1); return VIEWS.some(v=>v[0]===h) ? h : "dashboard"; }
window.addEventListener("hashchange", ()=>{ renderNav(); render(); });
function renderNav(){
  const v=currentView();
  $("#nav").innerHTML = VIEWS.map(([k,l,i]) => `<a href="#${k}" class="${v===k?"on":""}" aria-current="${v===k?"page":"false"}">${ICONS[i]}<span>${l}</span></a>`).join("");
}
function setSync(ok,txt){ $("#syncDot").className="dot "+(ok?"ok":"bad"); $("#syncTxt").textContent=txt; }

/* ---------- render ---------- */
function render(){
  if (!S.user) return;
  const v=currentView(); const m=$("#main");
  const banner = S.status==="error" ? `<div class="banner">Impossible de joindre Supabase. Vérifiez la connexion et le fichier config.js ; nouvel essai automatique toutes les 20 s.</div>` : "";
  const html = ({dashboard:vDashboard, media:vMedia, playlists:vPlaylists, displays:vDisplays, map:vMap, campaigns:vCampaigns, reports:vReports}[v] || vDashboard)();
  const y=window.scrollY; m.innerHTML = banner + html; window.scrollTo(0,y);
  bindView(v);
}
function head(title, sub, actions=""){ return `<div class="head"><div><h1>${title}</h1><p>${sub}</p></div><div class="row">${actions}</div></div>`; }
function niceStep(max){ const raw=max/4; const p=Math.pow(10,Math.floor(Math.log10(raw))); const n=raw/p; return Math.max(1,(n<=1?1:n<=2?2:n<=5?5:10)*p); }
function barChart(series, opts={}){
  const W=640, H=220, L=44, R=10, T=12, B=28;
  const max = Math.max(1, ...series.map(s=>s.a));
  const step = niceStep(max); const top = Math.ceil(max/step)*step;
  const iw=W-L-R, ih=H-T-B, bw=iw/series.length;
  const y = v => T + ih - (v/top)*ih;
  let g="";
  for (let v=0; v<=top; v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="JetBrains Mono,monospace">${fmtInt(v)}</text>`; }
  const every = Math.ceil(series.length/(opts.maxLabels||10));
  series.forEach((s,i)=>{
    const x=L+i*bw, w=Math.max(2,bw*0.62), cx=x+(bw-w)/2;
    g+=`<rect x="${cx}" y="${y(s.a)}" width="${w}" height="${Math.max(0,T+ih-y(s.a))}" rx="2" fill="color-mix(in srgb, var(--accent) 30%, transparent)"><title>${esc(s.label)} : ${fmtInt(s.a)} diffusions</title></rect>`;
    if (s.b!=null) g+=`<rect x="${cx}" y="${y(s.b)}" width="${w}" height="${Math.max(0,T+ih-y(s.b))}" rx="2" fill="var(--accent)"><title>${esc(s.label)} : ${fmtInt(s.b)} complètes</title></rect>`;
    if (i%every===0) g+=`<text x="${x+bw/2}" y="${H-9}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="JetBrains Mono,monospace">${esc(s.label)}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||"Graphique")}">${g}</svg></div>`;
}
function daySeries(r, n){ const by=Object.fromEntries((r?.days||[]).map(d=>[d.day,d])); const out=[]; for (let i=n-1;i>=0;i--){ const k=dayKey(addDays(-i)); const d=by[k]||{plays:0,complete:0}; out.push({label:fmtDay(k), a:+d.plays, b:+d.complete}); } return out; }
const legend = `<div class="legend"><span><i style="background:color-mix(in srgb,var(--accent) 30%,transparent)"></i>Diffusions</span><span><i style="background:var(--accent)"></i>Diffusions complètes</span></div>`;
const T0 = {plays:0,complete:0,seconds:0,impressions:0};
const onPill = `<span class="pill on"><span class="dot"></span>En ligne</span>`;
function statusPill(d){ const v=devOf(d); if (devOnline(v)) return onPill; if (!v) return `<span class="pill">Sans player</span>`; return `<span class="pill off" title="Dernier signal : ${esc(fmtAgo(v.last_seen))}"><span class="dot"></span>Hors ligne</span>`; }

/* Dashboard */
function vDashboard(){
  const today=dayKey(), from7=dayKey(addDays(-6));
  const rT=rep(today,today), r7=rep(from7,today);
  const tT=rT?.totals||T0; const byD=Object.fromEntries((r7?.displays||[]).map(x=>[x.display_id,x]));
  const online=S.displays.filter(isOnline).length;
  const rows = S.displays.map(d=>{ const p=byD[d.id]||T0; const now=nowOf(d);
    return `<tr><td><b>${esc(d.name)}</b><div class="hint">${esc(d.location||"—")}</div></td><td>${statusPill(d)}</td><td>${now?esc(now):'<span class="hint">—</span>'}</td><td class="n">${fmtInt(p.plays)}</td><td class="n">${fmtInt(p.impressions)}</td><td class="n">${fmtSec(p.seconds)}</td></tr>`; }).join("");
  return head("Dashboard","Vue d'ensemble du réseau kabby+") + `
  <div class="kpis">
    <div class="kpi"><span class="lbl">Écrans en ligne</span><span class="val num">${online}<span style="color:var(--muted);font-size:18px"> / ${S.displays.length}</span></span><span class="sub">signal reçu il y a moins de 3 min</span></div>
    <div class="kpi hl"><span class="lbl">Diffusions aujourd'hui</span><span class="val num">${fmtInt(tT.plays)}</span><span class="sub">${fmtInt(tT.complete)} complètes</span></div>
    <div class="kpi"><span class="lbl">Impressions aujourd'hui</span><span class="val num">${fmtInt(tT.impressions)}</span><span class="sub">diffusions × audience par écran</span></div>
    <div class="kpi"><span class="lbl">Contenus</span><span class="val num">${S.media.length}</span><span class="sub">${S.playlists.length} playlist${S.playlists.length>1?"s":""}</span></div>
  </div>
  <div class="grid2">
    <section class="panel"><div class="ph"><h2>Diffusions, 7 derniers jours</h2>${legend}</div>${barChart(daySeries(r7,7),{aria:"Diffusions par jour sur 7 jours"})}</section>
    <section class="panel"><div class="ph"><h2>Pour démarrer</h2></div>
      <ol style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:var(--muted)">
        <li><a href="#media" style="color:var(--fg)">Importez vos vidéos et visuels</a> dans la médiathèque.</li>
        <li><a href="#playlists" style="color:var(--fg)">Composez une playlist</a> et réglez la durée des images.</li>
        <li><a href="#displays" style="color:var(--fg)">Créez un écran, programmez la playlist</a> et associez le Player ID affiché par la tablette.</li>
        <li>Chaque diffusion remonte ensuite dans le reporting.</li>
      </ol></section>
  </div>
  <section class="panel"><div class="ph"><h2>Performance des écrans</h2><p>7 derniers jours</p></div>
    <div class="tbl-wrap"><table><thead><tr><th>Écran</th><th>Statut</th><th>En diffusion</th><th class="n">Diffusions</th><th class="n">Impressions</th><th class="n">Temps d'antenne</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="6" class="empty">${S.loaded?"Aucun écran. Ajoutez-en un dans l'onglet Écrans.":"Chargement des écrans…"}</td></tr>`}</tbody></table></div></section>`;
}

/* Media */
function vMedia(){
  const imgs=S.media.filter(m=>m.type==="image"), vids=S.media.filter(m=>m.type==="video");
  const bytes=S.media.reduce((a,m)=>a+(Number(m.size)||0),0);
  const list = S.media.filter(m=>S.mediaFilter==="all"||m.type===S.mediaFilter);
  const cards = list.map(m=>`<article class="mcard">
      <div class="thumb">${m.type==="video" ? `<video src="${thumbUrl(m)}#t=0.5" muted preload="metadata" playsinline></video>` : `<img src="${thumbUrl(m)}" alt="" loading="lazy">`}
        <span class="pill">${m.type==="video"?"Vidéo":"Image"}</span>${m.type==="video"?`<span class="dur">${fmtClock(m.duration)}</span>`:""}</div>
      <div class="meta"><b title="${esc(m.name)}">${esc(m.name)}</b><span>${m.width&&m.height?`${m.width}×${m.height} · `:""}${fmtBytes(m.size)}</span></div>
      <div class="act"><button class="icon-btn" data-del-media="${esc(m.id)}" aria-label="Supprimer ${esc(m.name)}">${ICONS.trash}</button></div>
    </article>`).join("");
  return head("Médiathèque","Vidéos et visuels prêts à diffuser") + `
  <div class="kpis">
    <div class="kpi"><span class="lbl">Vidéos</span><span class="val num">${vids.length}</span><span class="sub">${fmtSec(vids.reduce((a,m)=>a+(Number(m.duration)||0),0))} de contenu</span></div>
    <div class="kpi"><span class="lbl">Images</span><span class="val num">${imgs.length}</span><span class="sub">durée réglée dans la playlist</span></div>
    <div class="kpi"><span class="lbl">Stockage</span><span class="val num">${fmtBytes(bytes)}</span><span class="sub">taille max par fichier selon votre offre Supabase</span></div>
  </div>
  <label class="drop" id="drop" for="fileIn">${ICONS.up}<strong>Glissez vos fichiers ici ou cliquez pour parcourir</strong><span>MP4, WebM, JPG, PNG, WebP, GIF · les vidéos sont adaptées automatiquement aux tablettes (H.264, 1920×1080 max)</span></label>
  <input type="file" id="fileIn" accept="video/mp4,video/webm,image/jpeg,image/png,image/webp,image/gif" multiple hidden>
  ${S.uploads.length?`<div class="uploads">${S.uploads.map(u=>`<div class="up">${u.state==="busy"?'<span class="spin"></span>':u.state==="ok"?'<span class="pill on">OK</span>':'<span class="pill off">Erreur</span>'}<span class="name">${esc(u.name)}</span><span class="hint">${esc(u.msg||fmtBytes(u.size))}</span></div>`).join("")}</div>`:""}
  <section class="panel"><div class="ph"><h2>Bibliothèque</h2>
    <div class="chips">${[["all","Tous",S.media.length],["video","Vidéos",vids.length],["image","Images",imgs.length]].map(([k,l,n])=>`<button class="chip ${S.mediaFilter===k?"on":""}" data-mf="${k}">${l} · ${n}</button>`).join("")}</div></div>
    ${cards?`<div class="mgrid">${cards}</div>`:`<div class="empty">${S.loaded?"Aucun média pour l'instant. Importez votre première vidéo ci-dessus.":"Chargement de la médiathèque…"}</div>`}
  </section>`;
}

/* Playlists */
function vPlaylists(){
  const cards = S.playlists.map(p=>{
    const used = S.displays.filter(d=>(d.assignments||[]).some(a=>a.playlistId===p.id));
    const strip = (p.items||[]).slice(0,14).map(it=>{ const m=mediaById(it.mediaId); return m&&m.type==="image" ? `<div style="background-image:url('${thumbUrl(m)}')"></div>` : `<div style="background:color-mix(in srgb,var(--neon) ${m?35:8}%,var(--panel-2))" title="${esc(m?.name||"média supprimé")}"></div>`; }).join("");
    return `<article class="card"><div class="top"><div><h3>${esc(p.name)}</h3><div class="sub">${esc(p.description||"Sans description")}</div></div>${p.loop?'<span class="pill img">Boucle</span>':'<span class="pill">1 passage</span>'}</div>
      <div class="strip">${strip||'<div></div>'}</div>
      <dl class="specs"><dt>Contenus</dt><dd>${(p.items||[]).length}</dd><dt>Durée du cycle</dt><dd>${fmtClock(plDuration(p))}</dd><dt>Écrans</dt><dd>${used.length?used.map(d=>esc(d.name)).join(", "):"aucun"}</dd></dl>
      <div class="foot"><button class="btn sm" data-edit-pl="${esc(p.id)}">${ICONS.edit}Modifier</button><button class="btn sm ghost danger" data-del-pl="${esc(p.id)}">${ICONS.trash}Supprimer</button></div></article>`; }).join("");
  return head("Playlists","Séquences de diffusion pour vos annonceurs", `<button class="btn pri" id="newPl">${ICONS.plus}Nouvelle playlist</button>`) +
    (cards?`<div class="cards">${cards}</div>`:`<div class="panel"><div class="empty">${S.loaded?"Aucune playlist. Créez-en une pour assembler vos médias dans l'ordre de diffusion.":"Chargement des playlists…"}</div></div>`);
}

/* Displays */
function devLabel(v){ const i=v.info||{}; const ua=i.ua||"";
  const os=(/Android [\d.]+/.exec(ua)||[])[0] || (/iPad|iPhone/.test(ua)?"iPadOS":/Windows/.test(ua)?"Windows":/Mac OS/.test(ua)?"macOS":/Linux|CrOS/.test(ua)?"Linux":"Appareil");
  return `${os}${i.screen?" · "+i.screen:""}${/Fully/i.test(ua)?" · Fully Kiosk":""}`; }
function playerBox(d){
  const dev=devOf(d);
  if(!dev) return `<div class="pbox none"><span class="hint">Aucun player associé</span><button class="btn sm" data-pair-disp="${esc(d.id)}">Associer un player</button></div>`;
  const c=dev.cache||{};
  return `<div class="pbox"><div class="pbox-h"><span class="pid">${esc(fmtPid(dev.player_id))}</span>${devOnline(dev)?onPill:`<span class="pill off" title="Dernier signal">${esc(fmtAgo(dev.last_seen))}</span>`}</div>
    <div class="hint">${esc(devLabel(dev))}${dev.info?.version?" · "+esc(dev.info.version):""}</div>
    <div class="hint">Contenus en cache : <span class="mono">${c.ready??0}/${c.total??0}</span> · ${fmtBytes(c.bytes)}${c.off?" · cache local indisponible":""}${c.offline?" · fonctionne hors ligne":""}</div>
    <div class="pbox-a"><button class="btn sm" data-cmd="identify" data-dev="${esc(dev.player_id)}">Identifier</button><button class="btn sm" data-cmd="resync" data-dev="${esc(dev.player_id)}">Resynchroniser</button><button class="btn sm" data-cmd="reload" data-dev="${esc(dev.player_id)}">Redémarrer</button><button class="btn sm ghost danger" data-unpair="${esc(dev.player_id)}">Dissocier</button></div></div>`;
}
function vDisplays(){
  const today=dayKey(); const r=rep(today,today); const byD=Object.fromEntries((r?.displays||[]).map(x=>[x.display_id,x]));
  const waiting=S.devices.filter(v=>!v.display_id && Date.now()-ts(v.last_seen)<7*86400e3);
  const wait = waiting.length ? `<section class="panel"><div class="ph"><h2>Players en attente d'association</h2><p>Tablettes qui affichent leur Player ID</p></div>
    <div class="tbl-wrap"><table><thead><tr><th>Player ID</th><th>Appareil</th><th>Statut</th><th></th></tr></thead><tbody>${waiting.map(v=>`<tr><td><span class="pid">${esc(fmtPid(v.player_id))}</span></td><td>${esc(devLabel(v))}</td><td>${devOnline(v)?onPill:`<span class="pill off">${esc(fmtAgo(v.last_seen))}</span>`}</td><td style="text-align:right;white-space:nowrap"><button class="btn sm pri" data-pair-dev="${esc(v.player_id)}">Associer</button> <button class="icon-btn" data-forget="${esc(v.player_id)}" aria-label="Oublier ce player">${ICONS.trash}</button></td></tr>`).join("")}</tbody></table></div></section>` : "";
  const cards = S.displays.map(d=>{
    const t=byD[d.id]||T0;
    const as=(d.assignments||[]).slice().sort((x,y)=>(y.priority||0)-(x.priority||0));
    const now = nowOf(d);
    return `<article class="card"><div class="top"><div><h3>${esc(d.name)}</h3><div class="sub">${esc(d.location||"Sans emplacement")}</div></div>${statusPill(d)}</div>
      <dl class="specs"><dt>Format</dt><dd>${esc(d.resolution||"1920x1080")} · ${d.orientation==="portrait"?"portrait":"paysage"}</dd>
        <dt>Cadrage</dt><dd>${d.fit==="cover"?"remplir l'écran":"en entier"}</dd>
        <dt>En veille</dt><dd>1 spot, puis accueil ${d.idle_gap??20} s</dd>
        <dt>Audience</dt><dd>${(Number(d.audience)||1).toLocaleString("fr-FR")} contact${(Number(d.audience)||1)>1?"s":""} / diffusion</dd>
        <dt>Aujourd'hui</dt><dd>${fmtInt(t.plays)} diffusions</dd>
        ${now?`<dt>À l'écran</dt><dd>${esc(now)}</dd>`:""}</dl>
      ${playerBox(d)}
      <div><div class="hint" style="margin-bottom:4px">Programmation</div><div class="assign-list">${as.length?as.map(a=>{const p=plById(a.playlistId); const act=isActiveAssign(a); return `<div><span>${esc(p?.name||"Playlist supprimée")} ${act?'':'<span class="pill">inactive</span>'}</span><span class="when">P${a.priority||0} · ${a.start?fmtDay(a.start):"…"} → ${a.end?fmtDay(a.end):"…"}</span></div>`;}).join(""):'<span class="hint">Aucune playlist programmée</span>'}</div></div>
      <div class="foot"><button class="btn sm" data-rot="${esc(d.id)}">${ICONS.list}Rotation</button><button class="btn sm" data-sched="${esc(d.id)}">${ICONS.cal}Programmer</button><button class="btn sm" data-edit-d="${esc(d.id)}">${ICONS.edit}Modifier</button><button class="btn sm ghost danger" data-del-d="${esc(d.id)}" aria-label="Supprimer ${esc(d.name)}">${ICONS.trash}</button></div></article>`; }).join("");
  const playerUrl = new URL("player.html", location.href).href;
  return head("Écrans","Parc de diffusion, players et programmation", `<button class="btn" id="newD">${ICONS.plus}Ajouter un écran</button><button class="btn pri" id="pairBtn">${ICONS.screen}Associer un player</button>`) +
  `<div class="banner"><b>Installer une tablette :</b> dans Fully Kiosk (ou le navigateur), mettez en page d'accueil <span class="code">${esc(playerUrl)}</span>. Aucun compte n'est nécessaire : la tablette affiche son Player ID, saisissez-le avec « Associer un player ».</div>` +
  wait + (cards?`<div class="cards">${cards}</div>`:`<div class="panel"><div class="empty">${S.loaded?"Aucun écran enregistré. Créez-en un, puis associez une tablette.":"Chargement des écrans…"}</div></div>`);
}

/* Campagnes */
function campStrip(c){ return (c.items||[]).slice(0,14).map(it=>{ const m=mediaById(it.mediaId); return m&&m.type==="image" ? `<div style="background-image:url('${thumbUrl(m)}')"></div>` : `<div style="background:color-mix(in srgb,var(--neon) ${m?35:8}%,var(--panel-2))" title="${esc(m?.name||"média supprimé")}"></div>`; }).join(""); }
function goalBar(imp, goal){ if(!+goal) return ""; const pc=Math.min(100, imp/goal*100); return `<div><div class="hint" style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Objectif ${fmtInt(goal)} impressions</span><span class="mono">${pc.toFixed(0)} %</span></div><div class="prog"><i style="width:${pc}%"></i></div></div>`; }
function vCampaigns(){
  const r=campRep(); const by=Object.fromEntries((r||[]).map(x=>[x.campaign_id,x]));
  const live=S.campaigns.filter(c=>campState(c)==="live");
  const totImp=(r||[]).reduce((a,x)=>a+(+x.impressions||0),0);
  const cards=S.campaigns.map(c=>{ const t=by[c.id]||T0; const ds=(c.display_ids||[]).map(dispById).filter(Boolean);
    const reached = +c.goal_impressions && +t.impressions >= +c.goal_impressions;
    return `<article class="card"><div class="top"><div><h3>${esc(c.name)}</h3><div class="sub">${esc(c.advertiser||"Annonceur non renseigné")}</div></div>${reached && campState(c)==="live" ? '<span class="pill img">Objectif atteint</span>' : campPill(c)}</div>
      <div class="strip">${campStrip(c)||'<div></div>'}</div>
      <dl class="specs"><dt>Période</dt><dd>${fmtDay(c.start_date)} → ${fmtDay(c.end_date)}/${String(c.end_date).slice(0,4)}</dd>
        <dt>Part de voix</dt><dd>${["","standard ×1","renforcée ×2","premium ×3"][c.weight||1]||"×"+c.weight}</dd>
        <dt>Visuels</dt><dd>${(c.items||[]).length}</dd>
        <dt>Écrans</dt><dd>${ds.length?ds.map(d=>esc(d.name)).join(", "):"aucun"}</dd>
        <dt>Diffusions</dt><dd>${r?fmtInt(t.plays):"…"}</dd>
        <dt>Impressions</dt><dd><b>${r?fmtInt(t.impressions):"…"}</b></dd></dl>
      ${goalBar(+t.impressions||0, c.goal_impressions)}
      <div class="foot"><button class="btn sm" data-camp-rep="${esc(c.id)}">${ICONS.report}Bilan</button><button class="btn sm" data-edit-camp="${esc(c.id)}">${ICONS.edit}Modifier</button>
        <button class="btn sm ghost" data-pause-camp="${esc(c.id)}">${c.status==="paused"?"Reprendre":"Mettre en pause"}</button><button class="btn sm ghost danger" data-del-camp="${esc(c.id)}" aria-label="Supprimer ${esc(c.name)}">${ICONS.trash}</button></div></article>`; }).join("");
  return head("Campagnes","Les campagnes passent à tour de rôle dans la rotation de chaque écran, entre vos contenus maison", `<button class="btn pri" id="newCamp">${ICONS.plus}Nouvelle campagne</button>`) + `
  <div class="kpis">
    <div class="kpi hl"><span class="lbl">Campagnes en cours</span><span class="val num">${live.length}</span><span class="sub">${S.campaigns.length} au total</span></div>
    <div class="kpi"><span class="lbl">Écrans mobilisés</span><span class="val num">${new Set(live.flatMap(c=>c.display_ids||[])).size}</span><span class="sub">par les campagnes en cours</span></div>
    <div class="kpi"><span class="lbl">Impressions livrées</span><span class="val num">${r?fmtInt(totImp):"…"}</span><span class="sub">toutes campagnes, sur leur période</span></div>
  </div>` + (cards?`<div class="cards">${cards}</div>`:`<div class="panel"><div class="empty">${S.loaded?"Aucune campagne. Créez-en une : choisissez les visuels, les dates et les écrans, la diffusion démarre automatiquement.":"Chargement des campagnes…"}</div></div>`);
}

function openCampaignEditor(c){
  const t=dayKey();
  ED = c ? {camp:true, id:c.id, name:c.name, advertiser:c.advertiser||"", start:c.start_date, end:c.end_date, status:c.status, goal:c.goal_impressions||"", weight:c.weight||1, items:(c.items||[]).map(i=>({...i})), displays:new Set(c.display_ids||[]), q:""}
         : {camp:true, id:null, name:"", advertiser:"", start:t, end:dayKey(addDays(29)), status:"active", goal:"", weight:1, items:[], displays:new Set(), q:""};
  openModal(`<header><div><h2>${c?"Modifier la campagne":"Nouvelle campagne"}</h2><p>Pendant ses dates, la campagne entre dans la rotation des écrans cochés : un spot, un contenu maison, le spot d'une autre campagne… Elle s'arrête seule à sa date de fin ou quand l'objectif est atteint.</p></div><button class="icon-btn" data-close aria-label="Fermer">${ICONS.x}</button></header>
  <div class="body">
    <div class="fgrid"><div class="field"><label for="cName">Nom de la campagne</label><input id="cName" value="${esc(ED.name)}" placeholder="Orange Travel · novembre"></div>
      <div class="field"><label for="cAdv">Annonceur</label><input id="cAdv" value="${esc(ED.advertiser)}" placeholder="Orange"></div></div>
    <div class="fgrid"><div class="field"><label for="cStart">Début</label><input id="cStart" type="date" value="${esc(ED.start)}"></div>
      <div class="field"><label for="cEnd">Fin (incluse)</label><input id="cEnd" type="date" value="${esc(ED.end)}"></div></div>
    <div class="fgrid"><div class="field"><label for="cWeight">Part de voix</label><select id="cWeight">${[[1,"Standard (×1)"],[2,"Renforcée (×2)"],[3,"Premium (×3)"]].map(([k,l])=>`<option value="${k}" ${+ED.weight===k?"selected":""}>${l}</option>`).join("")}</select><p class="hint">Une campagne ×2 passe deux fois plus souvent qu'une campagne standard.</p></div>
      <div class="field"><label for="cGoal">Objectif d'impressions (facultatif)</label><input id="cGoal" type="number" min="0" step="1" value="${esc(ED.goal)}" placeholder="ex. 50000"><p class="hint">Le rythme s'ajuste chaque jour pour l'atteindre à la date de fin, puis la campagne s'arrête.</p></div></div>
    <div class="field"><label>Écrans de la campagne <span class="hint" id="dCount"></span></label>
      <div class="row" style="gap:8px;margin-bottom:6px"><button class="btn sm" type="button" id="dAll">Tout cocher</button><button class="btn sm ghost" type="button" id="dNone">Tout décocher</button></div>
      <div class="dpick" id="dPick"></div></div>
    <div class="field"><label>Visuels diffusés</label>
    <div class="editor">
      <div class="lib"><h3><span>Médiathèque</span><span>${S.media.length}</span></h3><div style="padding:8px 8px 0"><input class="inp" id="pQ" placeholder="Rechercher" aria-label="Rechercher un média"></div><div class="lib-list" id="libList"></div></div>
      <div class="seq"><h3><span>Visuels de la campagne</span><span id="seqTot"></span></h3><div class="seq-list" id="seqList"></div></div>
    </div></div>
  </div>
  <footer><span class="grow" id="pInfo"></span><button class="btn" data-close>Annuler</button><button class="btn pri" id="cSave">Enregistrer</button></footer>`, true);
  $("#cName").oninput=e=>ED.name=e.target.value; $("#cAdv").oninput=e=>ED.advertiser=e.target.value;
  $("#cStart").onchange=e=>ED.start=e.target.value; $("#cEnd").onchange=e=>ED.end=e.target.value; $("#cGoal").oninput=e=>ED.goal=e.target.value; $("#cWeight").onchange=e=>ED.weight=+e.target.value;
  $("#pQ").oninput=e=>{ED.q=e.target.value.toLowerCase(); drawLib();};
  $("#dAll").onclick=()=>{ S.displays.forEach(d=>ED.displays.add(d.id)); drawDPick(); };
  $("#dNone").onclick=()=>{ ED.displays.clear(); drawDPick(); };
  $("#cSave").onclick=saveCampaign;
  drawDPick(); drawLib(); drawSeq();
}
function drawDPick(){
  $("#dPick").innerHTML = S.displays.length ? S.displays.map(d=>{ const on=ED.displays.has(d.id);
    return `<label class="${on?"on":""}"><input type="checkbox" data-dp="${esc(d.id)}" ${on?"checked":""}><span><b>${esc(d.name)}</b><span class="hint">${esc(d.location||"Sans emplacement")} · ${isOnline(d)?"en ligne":"hors ligne"}</span></span></label>`; }).join("")
    : `<p class="hint">Aucun écran. Créez d'abord vos écrans dans l'onglet Écrans.</p>`;
  $("#dPick").querySelectorAll("[data-dp]").forEach(cb=>cb.onchange=()=>{ if(cb.checked) ED.displays.add(cb.dataset.dp); else ED.displays.delete(cb.dataset.dp); cb.closest("label").classList.toggle("on",cb.checked); $("#dCount").textContent=`· ${ED.displays.size} sélectionné${ED.displays.size>1?"s":""}`; });
  $("#dCount").textContent=`· ${ED.displays.size} sélectionné${ED.displays.size>1?"s":""}`;
}
async function saveCampaign(){
  const name=ED.name.trim(); if(!name){ $("#cName").focus(); toast("Donnez un nom à la campagne"); return; }
  if(!ED.start||!ED.end){ toast("Indiquez les dates de début et de fin"); return; }
  if(ED.end<ED.start){ toast("La date de fin précède la date de début"); return; }

/* Fond de carte vectoriel OpenFreeMap, recoloré aux couleurs du CMS (clair / sombre) */
const MAP_PAL = {
  light:{ bg:"#eef0f6", water:"#cfe4ee", park:"#e1eee6", resid:"#e9ebf3", building:"#e2e5ef", minor:"#ffffff", major:"#ffffff", casing:"#d7dbe8", motorway:"#f7dceb", rail:"#cfd3e1", boundary:"#b9bfd3", text:"#5d6279", halo:"#ffffff" },
  dark: { bg:"#0f1222", water:"#0b2533", park:"#102320", resid:"#131629", building:"#181c33", minor:"#1d2240", major:"#262c4d", casing:"#0b0d17", motorway:"#4a2141", rail:"#262b46", boundary:"#3a4066", text:"#8e94b4", halo:"#0b0d17" }
};
function mapTheme(){ const t=document.documentElement.dataset.theme; return t==="dark"||t==="light" ? t : (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); }
async function mapStyle(theme){
  S.mapBaseStyle = S.mapBaseStyle || await (await fetch("https://tiles.openfreemap.org/styles/positron")).json();
  const st = JSON.parse(JSON.stringify(S.mapBaseStyle)); const c = MAP_PAL[theme];
  const set=(l,k,v)=>{ l.paint=l.paint||{}; l.paint[k]=v; };
  const col=(l,v)=>{ const k={fill:"fill-color",line:"line-color",background:"background-color","fill-extrusion":"fill-extrusion-color",circle:"circle-color"}[l.type]; if(k) set(l,k,v); };
  st.layers = st.layers.filter(l => !/shield/.test(l.id) && l.source!=="ne2_shaded");
  for (const l of st.layers){
    const id=l.id;
    if (l.type==="symbol"){ set(l,"text-color",c.text); set(l,"text-halo-color",c.halo);
      if (l.layout && /name/.test(JSON.stringify(l.layout["text-field"]||""))) l.layout["text-field"]=["coalesce",["get","name:fr"],["get","name"]]; // libellés en français
      continue; }
    if (l.type==="raster") continue;
    if (l.type==="background") col(l,c.bg);
    else if (/water/.test(id)) col(l,c.water);
    else if (/park|wood/.test(id)) col(l,c.park);
    else if (/residential/.test(id)) col(l,c.resid);
    else if (/ice|glacier/.test(id)) col(l,c.bg);
    else if (id==="building") { col(l,c.building); if(l.paint && l.paint["fill-outline-color"]) set(l,"fill-outline-color",c.building); }
    else if (/casing/.test(id)) col(l,c.casing);
    else if (/motorway/.test(id)) col(l,c.motorway);
    else if (/major/.test(id)) col(l,c.major);
    else if (/minor|path|pier|aeroway|taxiway|runway/.test(id)) col(l,c.minor);
    else if (/rail/.test(id)) col(l,c.rail);
    else if (/boundary/.test(id)) col(l,c.boundary);
  }
  return st;
}

/* Positions en direct : on n'interroge que les positions, toutes les 5 s, tant que l'onglet Carte est affiché */
async function mapPollTick(){

    const rows=await q(S.sb.from("devices").select("player_id,display_id,last_pos,pos_at,last_seen,now_playing"));
    for (const r of rows){ const v=S.devices.find(x=>x.player_id===r.player_id); if (v) Object.assign(v,r); }

/* Glissement continu d'une position à l'autre (durée = intervalle entre deux positions reçues, 2 à 12 s) */
function glide(mk, to, dur){
  cancelAnimationFrame(mk._raf);
  const from=mk.getLngLat();
  const far=Math.abs(from.lng-to[0])>0.05 || Math.abs(from.lat-to[1])>0.05;
  if (far || dur<=0 || matchMedia("(prefers-reduced-motion: reduce)").matches){ mk.setLngLat(to); return; }
  const t0=performance.now();
  const step=now=>{ const k=Math.min(1,(now-t0)/dur); mk.setLngLat([from.lng+(to[0]-from.lng)*k, from.lat+(to[1]-from.lat)*k]); if(k<1) mk._raf=requestAnimationFrame(step); };
  mk._raf=requestAnimationFrame(step);
}
function mapUpdate(){

  const keep=new Set(rows.map(r=>r.v.player_id));
  for (const id of Object.keys(S.mapMarkers)) if(!keep.has(id)){ cancelAnimationFrame(S.mapMarkers[id]._raf); S.mapMarkers[id].remove(); delete S.mapMarkers[id]; }
  for (const r of rows){
    const id=r.v.player_id; let mk=S.mapMarkers[id];
    if (!mk){

      const pop=new maplibregl.Popup({offset:22, closeButton:true, maxWidth:"280px", className:"kpop"});

      mk._posAt=r.v.pos_at; mk._rot=r.heading||0;

    } else if (r.v.pos_at && r.v.pos_at!==mk._posAt){
      const dt=mk._posAt ? ts(r.v.pos_at)-ts(mk._posAt) : 0;
      glide(mk,[r.lon,r.lat], Math.max(2000, Math.min(12000, dt)));
      mk._posAt=r.v.pos_at;
    }
    if (r.heading!=null){ let d=((r.heading-(mk._rot%360))+540)%360-180; mk._rot=(mk._rot||0)+d; } // rotation par le plus court chemin
    const el=mk.getElement(); el.className=`car st-${r.st}${devOnline(r.v)&&+r.speed>3?" moving":""}${S.mapOpen===id?" sel":""}`;

    if (mk.getPopup().isOpen() || !mk._popSet){ mk.getPopup().setHTML(popupHtml(r)); mk._popSet=true; }
    else mk._popHtml=popupHtml(r);
  }
}
function mapFitAll(rows=mapRows().filter(r=>r.has), animate=true){

/* ---------- media ---------- */
const OK_TYPES=["video/mp4","video/webm","image/jpeg","image/png","image/webp","image/gif"];
function probe(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file); const done=v=>{ URL.revokeObjectURL(url); res(v); };
    if (file.type.startsWith("image/")){ const i=new Image(); i.onload=()=>done({width:i.naturalWidth,height:i.naturalHeight}); i.onerror=()=>done({}); i.src=url; }
    else { const v=document.createElement("video"); v.preload="metadata"; v.muted=true; v.onloadedmetadata=()=>done({width:v.videoWidth,height:v.videoHeight,duration:Math.round(v.duration*10)/10}); v.onerror=()=>done({}); v.src=url; }
  });
}

/* ---------- normalisation des médias (compatibilité tablettes) ---------- */
// Format cible universel : H.264 Main 4.0, AAC, au plus 1920×1080 (ou 1080×1920 en portrait).
const BOX_LONG=1920, BOX_SHORT=1080;
function targetSize(w,h){
  const land=w>=h; const s=Math.min(1, land ? Math.min(BOX_LONG/w, BOX_SHORT/h) : Math.min(BOX_SHORT/w, BOX_LONG/h));
  const even=n=>Math.max(2, Math.round(n/2)*2);
  return { w: even(w*s), h: even(h*s), scaled: s<1 };
}
async function inspectVideo(file){
  const out={ avc:false, profile:null, level:null, audio:false, mp4:/mp4/.test(file.type) };
  if (!out.mp4 || file.size>300*1024*1024) return out;
  const b=new Uint8Array(await file.arrayBuffer()); const s=new TextDecoder("latin1").decode(b);
  const i=s.indexOf("avcC"); if (i>0){ out.avc=true; out.profile=b[i+5]; out.level=b[i+7]; }
  out.audio = s.indexOf("mp4a")>0;
  return out;
}
function videoNeedsConversion(meta, insp){
  const big = meta.width && meta.height && targetSize(meta.width, meta.height).scaled;
  const badCodec = !insp.mp4 || !insp.avc || ![66,77,100].includes(insp.profile) || (insp.level||0) > 41;
  return { needed: !!(big || badCodec), reason: big ? `${meta.width}×${meta.height} trop grand` : badCodec ? (insp.avc ? `profil H.264 niveau ${(insp.level||0)/10} trop élevé` : "codec non compatible") : "" };
}
function pickRecorderType(withAudio){
  const c=[withAudio?"video/mp4;codecs=avc1.4d0028,mp4a.40.2":null,"video/mp4;codecs=avc1.4d0028","video/mp4;codecs=avc1.42E028","video/mp4"].filter(Boolean);
  return c.find(t=>window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || null;
}
async function transcodeVideo(file, meta, insp, onProgress){
  const { w, h } = targetSize(meta.width||1920, meta.height||1080);
  const url=URL.createObjectURL(file);
  const v=document.createElement("video"); v.src=url; v.playsInline=true; v.preload="auto";
  await new Promise((res,rej)=>{ v.onloadedmetadata=res; v.onerror=()=>rej(new Error("Vidéo illisible dans le navigateur")); });
  const c=document.createElement("canvas"); c.width=w; c.height=h; const g=c.getContext("2d"); g.fillStyle="#000"; g.fillRect(0,0,w,h);
  const stream=c.captureStream(Math.min(30, 25));
  let ac=null, withAudio=false;
  if (insp.audio){
    try{ ac=new AudioContext(); await ac.resume(); const src=ac.createMediaElementSource(v); const dst=ac.createMediaStreamDestination(); src.connect(dst); dst.stream.getAudioTracks().forEach(t=>stream.addTrack(t)); withAudio=true; }catch(e){ withAudio=false; }
  }
  const type=pickRecorderType(withAudio); if(!type) throw new Error("Conversion impossible dans ce navigateur (utilisez Chrome)");
  const bps=Math.max(2500000, Math.round(6000000*(w*h)/(1920*1080)));
  const rec=new MediaRecorder(stream,{ mimeType:type, videoBitsPerSecond:bps, audioBitsPerSecond:128000 });
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  const draw=()=>{ g.drawImage(v,0,0,w,h); onProgress && onProgress(v.currentTime, v.duration); if(!v.ended) v.requestVideoFrameCallback(draw); };
  v.muted=!withAudio;
  rec.start(1000); v.requestVideoFrameCallback(draw);
  try{ await v.play(); }catch(e){ v.muted=true; await v.play(); }
  await new Promise(r=>v.onended=r); await new Promise(r=>setTimeout(r,300));
  rec.stop(); await new Promise(r=>rec.onstop=r);
  stream.getTracks().forEach(t=>t.stop()); if(ac) ac.close(); URL.revokeObjectURL(url);
  const blob=new Blob(chunks,{type:"video/mp4"});
  return { blob, width:w, height:h, duration: Math.round((v.duration||meta.duration||0)*10)/10, audio:withAudio };
}
async function resizeImage(file, meta){
  const { w, h, scaled } = targetSize(meta.width, meta.height);
  if (!scaled) return null;
  const img=new Image(); const url=URL.createObjectURL(file); img.src=url; await img.decode();
  const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
  const type = file.type==="image/png" ? "image/png" : "image/jpeg";
  const blob = await new Promise(r=>c.toBlob(r, type, 0.9));
  return { blob, width:w, height:h, type };
}
const safeName = n => n.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9._-]+/g,"-").replace(/-+/g,"-").slice(-80);
async function handleFiles(list){
  for (const file of Array.from(list||[])){
    const u={name:file.name,size:file.size,state:"busy"}; S.uploads.unshift(u); render();
    if (!OK_TYPES.includes(file.type)){ u.state="err"; u.msg="Format non pris en charge"; render(); continue; }
    try{
      let info=await probe(file), body=file, type=file.type, name=file.name, note="";
      if (file.type.startsWith("video")){
        u.msg="Analyse du format…"; render();
        const insp=await inspectVideo(file); const chk=videoNeedsConversion(info, insp);
        if (chk.needed){
          u.msg=`Adaptation pour tablette (${chk.reason})… gardez cet onglet affiché`; render();
          const r=await transcodeVideo(file, info, insp, (t,dur)=>{ const m=`Adaptation pour tablette : ${Math.round(t)}/${Math.round(dur||0)} s · gardez cet onglet affiché`; if(u.msg!==m){ u.msg=m; render(); } });
          body=r.blob; type="video/mp4"; info={width:r.width,height:r.height,duration:r.duration||info.duration};
          name=file.name.replace(/\.[^.]+$/,"")+".mp4"; note=` · adapté en ${r.width}×${r.height}${insp.audio&&!r.audio?" (sans son)":""}`;
        }
      } else if (file.type!=="image/gif" && info.width && info.height){
        const r=await resizeImage(file, info);
        if (r){ body=r.blob; type=r.type; info={width:r.width,height:r.height}; note=` · redimensionné en ${r.width}×${r.height}`; }
      }
      u.msg="Envoi…"; render();
      const d=new Date(); const path=`${d.getFullYear()}/${pad(d.getMonth()+1)}/${crypto.randomUUID()}-${safeName(name)}`;
      await q(S.sb.storage.from("media").upload(path,body,{contentType:type,cacheControl:"31536000",upsert:false}));
      await q(S.sb.from("media").insert({ name, type:type.startsWith("video")?"video":"image", path, mime:type, size:body.size, width:info.width||null, height:info.height||null, duration:info.duration||null }));
      u.state="ok"; u.msg="Importé"+note;
    }catch(e){ console.error(e); u.state="err"; const m=String(e?.message||""); u.msg = /exceeded|too large|Payload/i.test(m)?"Fichier trop lourd pour votre offre":/security|policy/i.test(m)?"Droits insuffisants":"Échec : "+m.slice(0,60); }
    render();
  }
  await loadAll();
  setTimeout(()=>{ S.uploads=S.uploads.filter(u=>u.state!=="ok"); render(); }, 4000);
}
async function deleteMedia(m){
  try{
    for (const p of S.playlists){ if ((p.items||[]).some(i=>i.mediaId===m.id)) await q(S.sb.from("playlists").update({items:p.items.filter(i=>i.mediaId!==m.id), updated_at:new Date().toISOString()}).eq("id",p.id)); }
    await q(S.sb.from("media").delete().eq("id",m.id));
    await S.sb.storage.from("media").remove([m.path]);
    toast("Média supprimé"); loadAll();
  }catch(e){ fail(e,"La suppression"); }
}
async function deletePlaylist(p){
  try{
    for (const d of S.displays){ if ((d.assignments||[]).some(a=>a.playlistId===p.id)) await q(S.sb.from("displays").update({assignments:d.assignments.filter(a=>a.playlistId!==p.id)}).eq("id",d.id)); }
    await q(S.sb.from("playlists").delete().eq("id",p.id)); toast("Playlist supprimée"); loadAll();
  }catch(e){ fail(e,"La suppression"); }
}
