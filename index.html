document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("#scrim")) closeModal(); });
function confirmBox(title, text, onYes, yesLabel="Supprimer"){
  openModal(`<header><div><h2>${esc(title)}</h2><p>${esc(text)}</p></div></header><footer><button class="btn" data-close>Annuler</button><button class="btn pri" id="yes" style="background:var(--bad);border-color:var(--bad);color:#fff">${esc(yesLabel)}</button></footer>`);
  $("#yes").onclick=()=>{ closeModal(); onYes(); };
}
function openDisplayEditor(d){
  const x=d||{name:"",location:"",orientation:"landscape",resolution:"1920x1080",audience:1};
  openModal(`<header><div><h2>${d?"Modifier l'écran":"Ajouter un écran"}</h2><p>L'audience par diffusion sert au calcul des impressions.</p></div><button class="icon-btn" data-close aria-label="Fermer">${ICONS.x}</button></header>
  <form class="body" id="dForm">
    <div class="field"><label for="dName">Nom</label><input id="dName" required value="${esc(x.name)}" placeholder="kabby-0004"></div>
    <div class="field"><label for="dLoc">Emplacement</label><input id="dLoc" value="${esc(x.location)}" placeholder="Paris · taxi H2"></div>
    <div class="fgrid">
      <div class="field"><label for="dOr">Orientation</label><select id="dOr"><option value="landscape" ${x.orientation!=="portrait"?"selected":""}>Paysage</option><option value="portrait" ${x.orientation==="portrait"?"selected":""}>Portrait</option></select></div>
      <div class="field"><label for="dRes">Résolution</label><input id="dRes" value="${esc(x.resolution)}" placeholder="1920x1080"></div>
    </div>
    <div class="field"><label for="dFit">Cadrage des contenus</label><select id="dFit"><option value="contain" ${x.fit!=="cover"?"selected":""}>Afficher en entier (bandes noires si besoin)</option><option value="cover" ${x.fit==="cover"?"selected":""}>Remplir l'écran (bords rognés si besoin)</option></select><p class="hint">Exemple : une vidéo 16:9 sur une tablette 16:10 affiche de fines bandes noires en mode « en entier », ou perd un peu des côtés en mode « remplir ».</p></div>
    <div class="field"><label for="dGap">En veille : écran d'accueil entre deux spots (secondes)</label><input id="dGap" type="number" min="5" max="600" step="1" value="${esc(x.idle_gap??20)}"><p class="hint">Quand personne ne joue, la tablette alterne : 1 spot, puis l'écran d'accueil « Commencer » pendant cette durée, puis 1 spot… (application v6 et suivantes).</p></div>
    <div class="field"><label for="dAud">Audience par diffusion (contacts)</label><input id="dAud" type="number" min="0" step="0.1" value="${esc(x.audience??1)}"><p class="hint">Ex. 1,4 passager en moyenne par trajet taxi. Impressions = diffusions × audience.</p></div>
  </form>
  <footer><button class="btn" data-close>Annuler</button><button class="btn pri" id="dSave">Enregistrer</button></footer>`);
  const save=async()=>{
    const name=$("#dName").value.trim(); if(!name){ $("#dName").focus(); toast("Donnez un nom à l'écran"); return; }
    const data={name, location:$("#dLoc").value.trim(), orientation:$("#dOr").value, resolution:$("#dRes").value.trim()||"1920x1080", fit:$("#dFit").value, idle_gap:Math.max(5,Math.min(600,parseInt($("#dGap").value,10)||20)), audience:Math.max(0,parseFloat($("#dAud").value)||1)};
    try{ if(d) await q(S.sb.from("displays").update(data).eq("id",d.id)); else await q(S.sb.from("displays").insert(data)); closeModal(); toast(d?"Écran mis à jour":"Écran ajouté"); loadAll(); }catch(e){fail(e);}
  };
  $("#dSave").onclick=save; $("#dForm").onsubmit=e=>{e.preventDefault(); save();};
}
function openSchedule(d){
  let rows=(d.assignments||[]).map(a=>({...a}));
  const draw=()=>{
    $("#aRows").innerHTML = rows.length ? rows.map((a,i)=>`<div class="arow">
      <div class="field"><label for="ap${i}">Playlist</label><select id="ap${i}" data-i="${i}" data-k="playlistId">${S.playlists.map(p=>`<option value="${esc(p.id)}" ${p.id===a.playlistId?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div>
      <div class="field"><label for="apr${i}">Priorité</label><input id="apr${i}" type="number" min="0" max="99" data-i="${i}" data-k="priority" value="${esc(a.priority??1)}"></div>
      <div class="field"><label for="as${i}">Début</label><input id="as${i}" type="date" data-i="${i}" data-k="start" value="${esc(a.start||"")}"></div>
      <div class="field"><label for="ae${i}">Fin</label><input id="ae${i}" type="date" data-i="${i}" data-k="end" value="${esc(a.end||"")}"></div>
      <button class="icon-btn" data-rm="${i}" aria-label="Retirer">${ICONS.trash}</button></div>`).join("") : `<p class="hint">Aucune playlist programmée sur cet écran.</p>`;
    $("#aRows").querySelectorAll("[data-k]").forEach(el=>el.onchange=()=>{ const r=rows[+el.dataset.i]; r[el.dataset.k]= el.dataset.k==="priority" ? (+el.value||0) : el.value; });
    $("#aRows").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ rows.splice(+b.dataset.rm,1); draw(); });
  };
  openModal(`<header><div><h2>Programmation · ${esc(d.name)}</h2><p>La priorité la plus haute joue d'abord. Une playlist en boucle tourne seule ; sinon le player enchaîne les playlists actives par priorité.</p></div><button class="icon-btn" data-close aria-label="Fermer">${ICONS.x}</button></header>
    <div class="body"><div id="aRows" style="display:flex;flex-direction:column;gap:12px"></div>
    ${S.playlists.length?`<button class="btn sm" id="aAdd" style="align-self:flex-start">${ICONS.plus}Ajouter une playlist</button>`:`<p class="hint">Créez d'abord une playlist.</p>`}</div>
    <footer><button class="btn" data-close>Annuler</button><button class="btn pri" id="aSave">Enregistrer</button></footer>`, true);
  draw();
  if ($("#aAdd")) $("#aAdd").onclick=()=>{ rows.push({playlistId:S.playlists[0].id, priority:1, start:dayKey(), end:""}); draw(); };
  $("#aSave").onclick=async()=>{ const bad=rows.find(r=>r.start&&r.end&&r.end<r.start); if(bad){ toast("Une date de fin précède sa date de début"); return; }
    try{ await q(S.sb.from("displays").update({assignments:rows.map(r=>({playlistId:r.playlistId, priority:+r.priority||0, start:r.start||"", end:r.end||""}))}).eq("id",d.id)); closeModal(); toast("Programmation enregistrée : les players la reçoivent sous 20 s"); loadAll(); }catch(e){fail(e);} };
}
function openPlaylistEditor(p){
  ED = p ? {id:p.id, name:p.name, description:p.description||"", loop:p.loop!==false, items:(p.items||[]).map(i=>({...i})), q:""} : {id:null, name:"", description:"", loop:true, items:[], q:""};
  openModal(`<header><div><h2>${p?"Modifier la playlist":"Nouvelle playlist"}</h2><p>Ajoutez des médias, glissez-les pour changer l'ordre, réglez la durée des images.</p></div><button class="icon-btn" data-close aria-label="Fermer">${ICONS.x}</button></header>
  <div class="body">
    <div class="fgrid"><div class="field"><label for="pName">Nom</label><input id="pName" value="${esc(ED.name)}" placeholder="Orange Travel · novembre"></div>
    <div class="field"><label for="pDesc">Description</label><input id="pDesc" value="${esc(ED.description)}" placeholder="Annonceur, campagne, consignes"></div></div>
    <label class="check"><input type="checkbox" id="pLoop" ${ED.loop?"checked":""}> Boucle : rejouer cette playlist sans passer aux suivantes</label>
    <div class="editor">
      <div class="lib"><h3><span>Médiathèque</span><span>${S.media.length}</span></h3><div style="padding:8px 8px 0"><input class="inp" id="pQ" placeholder="Rechercher" aria-label="Rechercher un média"></div><div class="lib-list" id="libList"></div></div>
      <div class="seq"><h3><span>Séquence</span><span id="seqTot"></span></h3><div class="seq-list" id="seqList"></div></div>
    </div>
  </div>
  <footer><span class="grow" id="pInfo"></span><button class="btn" data-close>Annuler</button><button class="btn pri" id="pSave">Enregistrer</button></footer>`, true);
  $("#pName").oninput=e=>ED.name=e.target.value; $("#pDesc").oninput=e=>ED.description=e.target.value; $("#pLoop").onchange=e=>ED.loop=e.target.checked;
  $("#pQ").oninput=e=>{ED.q=e.target.value.toLowerCase(); drawLib();};
  $("#pSave").onclick=savePlaylist;
  drawLib(); drawSeq();
}
function miniThumb(m){ if(!m) return `<div class="mini"></div>`; return `<div class="mini">${m.type==="video"?`<video src="${thumbUrl(m)}#t=0.5" muted preload="metadata"></video>`:`<img src="${thumbUrl(m)}" alt="" loading="lazy">`}</div>`; }
function drawLib(){
  const list=S.media.filter(m=>!ED.q||m.name.toLowerCase().includes(ED.q));
  $("#libList").innerHTML = list.length ? list.map(m=>`<div class="li">${miniThumb(m)}<div class="nm"><b title="${esc(m.name)}">${esc(m.name)}</b><span>${m.type==="video"?"vidéo · "+fmtClock(m.duration):"image"}</span></div><button class="icon-btn" data-add="${esc(m.id)}" aria-label="Ajouter ${esc(m.name)}">${ICONS.plus}</button></div>`).join("") : `<div class="empty">${S.media.length?"Aucun résultat":"Importez d'abord des médias."}</div>`;
  $("#libList").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{ const m=mediaById(b.dataset.add); ED.items.push({mediaId:m.id, duration:m.type==="video"?(Number(m.duration)||0):10}); drawSeq(); const sl=$("#seqList"); sl.scrollTop=sl.scrollHeight; });
}
function updTotals(){ const t=ED.items.reduce((a,it)=>a+itemDuration(it),0); $("#seqTot").textContent=fmtClock(t); $("#pInfo").textContent=`${ED.items.length} contenu${ED.items.length>1?"s":""} · cycle de ${fmtClock(t)}`; }
function drawSeq(){
  const sl=$("#seqList");
  sl.innerHTML = ED.items.length ? ED.items.map((it,i)=>{ const m=mediaById(it.mediaId);
    return `<div class="li" draggable="true" data-i="${i}"><span class="grip" aria-hidden="true">${ICONS.grip}</span><span class="idx">${i+1}</span>${miniThumb(m)}
      <div class="nm"><b>${esc(m?.name||"Média supprimé")}</b><span>${m?.type==="video"?"vidéo · durée native":"image"}</span></div>
      ${m?.type==="image"?`<input class="dur-in" type="number" min="1" max="3600" value="${esc(it.duration||10)}" data-dur="${i}" aria-label="Durée en secondes">`:`<span class="mono hint">${fmtClock(m?.duration)}</span>`}
      <button class="icon-btn" data-mv="${i}:-1" aria-label="Monter">${ICONS.upA}</button><button class="icon-btn" data-mv="${i}:1" aria-label="Descendre">${ICONS.dnA}</button><button class="icon-btn" data-rm="${i}" aria-label="Retirer">${ICONS.x}</button></div>`; }).join("")
    : `<div class="empty">Ajoutez des médias depuis la colonne de gauche.</div>`;
  sl.querySelectorAll("[data-dur]").forEach(el=>el.oninput=()=>{ ED.items[+el.dataset.dur].duration=Math.max(1,+el.value||1); updTotals(); });
  sl.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ ED.items.splice(+b.dataset.rm,1); drawSeq(); });
  sl.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{ const [i,dir]=b.dataset.mv.split(":").map(Number); const j=i+dir; if(j<0||j>=ED.items.length) return; [ED.items[i],ED.items[j]]=[ED.items[j],ED.items[i]]; drawSeq(); });
  let from=null;
  sl.querySelectorAll(".li[draggable]").forEach(el=>{
    el.addEventListener("dragstart",e=>{ from=+el.dataset.i; el.classList.add("drag"); e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",String(from)); });
    el.addEventListener("dragend",()=>el.classList.remove("drag"));
    el.addEventListener("dragover",e=>{ e.preventDefault(); el.classList.add("dropto"); });
    el.addEventListener("dragleave",()=>el.classList.remove("dropto"));
    el.addEventListener("drop",e=>{ e.preventDefault(); el.classList.remove("dropto"); const to=+el.dataset.i; if(from==null||from===to) return; const [it]=ED.items.splice(from,1); ED.items.splice(to,0,it); from=null; drawSeq(); });
  });
  updTotals();
}
async function savePlaylist(){
  const name=ED.name.trim(); if(!name){ $("#pName").focus(); toast("Donnez un nom à la playlist"); return; }
  const data={name, description:ED.description.trim(), loop:ED.loop, items:ED.items.map(i=>({mediaId:i.mediaId, duration:+i.duration||10})), updated_at:new Date().toISOString()};
  try{ if(ED.id) await q(S.sb.from("playlists").update(data).eq("id",ED.id)); else await q(S.sb.from("playlists").insert(data)); closeModal(); toast("Playlist enregistrée"); loadAll(); }catch(e){fail(e);}
}

/* ---------- players ---------- */
async function sendCmd(pid,type){
  const label={identify:"Identifier",resync:"Resynchroniser",reload:"Redémarrer"}[type];
  try{ await q(S.sb.from("devices").update({command:{type,at:Date.now()}}).eq("player_id",pid)); toast(`« ${label} » envoyé à ${fmtPid(pid)} : exécuté à la prochaine synchro (≤ 20 s)`); }catch(e){fail(e,"L'envoi");}
}
async function unpair(pid){
  try{ await q(S.sb.from("devices").update({display_id:null}).eq("player_id",pid)); toast("Player dissocié"); loadAll(); }catch(e){fail(e);}
}
function openPair({playerId,displayId}){
  if(!S.displays.length){ toast("Ajoutez d'abord un écran."); return; }
  openModal(`<header><div><h2>Associer un player</h2><p>Saisissez le Player ID affiché sur la tablette, puis choisissez l'écran qu'elle représente.</p></div><button class="icon-btn" data-close aria-label="Fermer">${ICONS.x}</button></header>
  <form class="body" id="pairForm">
    <div class="field"><label for="pairPid">Player ID</label><input id="pairPid" class="pid-in" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="XXXX-XXXX" value="${esc(playerId?fmtPid(playerId):"")}"></div>
    <div class="field"><label for="pairDisp">Écran</label><select id="pairDisp">${S.displays.map(d=>`<option value="${esc(d.id)}" ${d.id===displayId?"selected":""}>${esc(d.name)}${d.location?" · "+esc(d.location):""}${devOf(d)?" (a déjà un player)":""}</option>`).join("")}</select></div>
    <p class="hint" id="pairMsg">Si l'écran a déjà un player, l'ancien est dissocié et repasse en attente.</p>
  </form>
  <footer><button class="btn" data-close>Annuler</button><button class="btn pri" id="pairGo">Associer</button></footer>`);
  const inp=$("#pairPid");
  inp.oninput=()=>{ const n=normPid(inp.value).slice(0,8); inp.value=n.length>4?n.slice(0,4)+"-"+n.slice(4):n; };
  const go=async()=>{
    const pid=normPid(inp.value), did=$("#pairDisp").value, msg=$("#pairMsg");
    if(pid.length!==8){ msg.textContent="Le Player ID compte 8 caractères, par exemple 7KQ3-M9XA."; inp.focus(); return; }
    $("#pairGo").disabled=true;
    try{
      const found=await q(S.sb.from("devices").select("player_id,display_id").eq("player_id",pid));
      if(!found.length){ msg.textContent=`Aucun player ${fmtPid(pid)} connu. Vérifiez le code et que la tablette est connectée à Internet.`; $("#pairGo").disabled=false; return; }
      await q(S.sb.from("devices").update({display_id:null}).eq("display_id",did).neq("player_id",pid));
      await q(S.sb.from("devices").update({display_id:did, paired_at:new Date().toISOString()}).eq("player_id",pid));
      closeModal(); toast(`${fmtPid(pid)} associé à ${dispById(did)?.name||"l'écran"} : la diffusion démarre sous 20 s`); loadAll();
    }catch(e){ $("#pairGo").disabled=false; fail(e,"L'association"); }
  };
  $("#pairGo").onclick=go; $("#pairForm").onsubmit=e=>{e.preventDefault(); go();};
}

/* ---------- CSV ---------- */
async function exportCsv(){
  const to=dayKey(), from=dayKey(addDays(-(S.range-1)));
  try{
    const rows=await q(S.sb.rpc("report_rows",{p_from:from,p_to:to,p_display:S.repDisplay==="all"?null:S.repDisplay}));
    const lines=[["date","ecran","emplacement","media","type","diffusions","completes","secondes","impressions"], ...rows.map(r=>[r.day,r.display,r.location,r.media,r.type,r.plays,r.complete,r.seconds,r.impressions])];
    const csv="﻿"+lines.map(r=>r.map(c=>{ const t=String(c??""); return /[;"\n]/.test(t)?`"${t.replace(/"/g,'""')}"`:t; }).join(";")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=`kabby-proof-of-play_${from}_${to}.csv`; document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ fail(e,"L'export"); }
}

/* ---------- auth & boot ---------- */
function showLogin(msg=""){
  $("#app").hidden=true; $("#login").hidden=false;
  $("#loginMsg").textContent=msg;
}
async function afterLogin(session){
  S.user=session.user;
  const staff = await S.sb.rpc("is_staff");
  if (staff.error || staff.data!==true){ await S.sb.auth.signOut(); S.user=null; showLogin(staff.error ? "Impossible de vérifier vos droits : le schéma SQL est-il installé ?" : `${session.user.email} n'est pas dans l'équipe autorisée (table staff).`); return; }
  $("#login").hidden=true; $("#app").hidden=false; $("#who").textContent=session.user.email;
  renderNav(); render(); loadAll();
  clearInterval(boot.t); boot.t=setInterval(()=>{ if(!document.hidden){ loadAll(); S.rep={}; S.camp={}; } },20000);
}
async function boot(){
  if(!window.supabase || !CFG.supabaseUrl || /VOTRE-PROJET/.test(CFG.supabaseUrl)){ showLogin("Renseignez l'URL et la clé anon de votre projet Supabase dans config.js."); $("#loginForm").hidden=true; return; }
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true}});
  $("#loginForm").onsubmit=async e=>{ e.preventDefault(); const btn=$("#loginGo"); btn.disabled=true; $("#loginMsg").textContent="";
    const { data, error } = await S.sb.auth.signInWithPassword({ email:$("#lEmail").value.trim(), password:$("#lPass").value });
    btn.disabled=false; if(error){ $("#loginMsg").textContent=/confirm/i.test(error.message)?"Confirmez d'abord votre e-mail (lien reçu par mail), puis reconnectez-vous.":"E-mail ou mot de passe incorrect."; return; } afterLogin(data.session); };
  $("#signupGo").onclick=async()=>{ const email=$("#lEmail").value.trim(), password=$("#lPass").value, msg=$("#loginMsg");
    if(!email||password.length<8){ msg.textContent="Saisissez votre e-mail et un mot de passe d'au moins 8 caractères, puis cliquez à nouveau."; return; }
    const { data, error } = await S.sb.auth.signUp({ email, password, options:{ emailRedirectTo: location.href.split('#')[0] } });
    if(error){ msg.textContent = /registered|exists/i.test(error.message) ? "Ce compte existe déjà : cliquez « Se connecter »." : "Création impossible : "+error.message; return; }
    if(data.session){ afterLogin(data.session); return; }
    msg.style.color="var(--good)"; msg.textContent="Compte créé. Ouvrez le lien de confirmation reçu par e-mail, puis revenez ici et cliquez « Se connecter »."; };
  $("#logout").onclick=async()=>{ await S.sb.auth.signOut(); location.reload(); };
  const { data } = await S.sb.auth.getSession();
  if (data.session) afterLogin(data.session); else showLogin();
}
boot();
})();

</script>
